<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Администратор</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a href="/" class="nav-btn">Терминал</a>
        <button id="logoutBtn" style="display: none" onclick="adminLogout()">
          Выйти
        </button>
      </div>

      <!-- ===== Форма входа ===== -->
      <div class="card" id="loginCard">
        <h2>Вход администратора</h2>
        <input id="adminLoginInput" placeholder="Логин" />
        <input type="password" id="adminPassword" placeholder="Пароль" />
        <button onclick="adminLogin()">Войти</button>
      </div>

      <!-- ===== Форма регистрации и логи ===== -->
      <div class="card" id="registrationCard" style="display: none">
        <h2>Регистрация пользователя</h2>
        <input id="fio" placeholder="ФИО полностью" />
        <input id="uid" placeholder="UID карты" />
        <select id="department">
          <option value="ГВК">ГВК</option>
          <option value="ОГТ">ОГТ</option>
          <option value="Склад">Склад</option>
          <option value="Офис">Офис</option>
        </select>
        <button onclick="addUser()">Добавить</button>

        <h2>Логи</h2>
        <button onclick="loadLogs()">Обновить логи</button>
        <table id="logsTable"></table>
      </div>
    </div>
    <script src="/admin.js"></script>
  </body>
</html>
